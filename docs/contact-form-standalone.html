<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Shannon Chapoy</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* CSS Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            color: #2D2D2D;
            background-color: #F9F5FA;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Contact Section Styles */
        .contact-section {
            padding: 80px 0;
            background-color: #F9F5FA;
        }
        
        .contact-container {
            max-width: 1024px;
            margin: 0 auto;
            padding: 0 16px;
        }
        
        @media (min-width: 640px) {
            .contact-container {
                padding: 0 24px;
            }
        }
        
        @media (min-width: 1024px) {
            .contact-container {
                padding: 0 32px;
            }
        }
        
        .contact-card {
            background-color: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        @media (min-width: 768px) {
            .contact-card {
                flex-direction: row;
            }
        }
        
        /* Left Sidebar */
        .contact-sidebar {
            background-color: #543178;
            padding: 40px;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        @media (min-width: 768px) {
            .contact-sidebar {
                width: 40%;
            }
        }
        
        .contact-sidebar h3 {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 24px;
        }
        
        .contact-sidebar p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .contact-info-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .contact-info-item svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        
        .social-links {
            display: flex;
            gap: 16px;
            margin-top: 32px;
        }
        
        .social-link {
            padding: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
            text-decoration: none;
            color: #FFFFFF;
        }
        
        .social-link:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .social-link svg {
            width: 20px;
            height: 20px;
        }
        
        /* Form Section */
        .contact-form-wrapper {
            padding: 40px;
        }
        
        @media (min-width: 768px) {
            .contact-form-wrapper {
                width: 60%;
            }
        }
        
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #2D2D2D;
            margin-bottom: 4px;
        }
        
        .form-input,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
            font-family: 'Lato', sans-serif;
            font-size: 16px;
            color: #2D2D2D;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .form-input:focus,
        .form-textarea:focus {
            border-color: #7D337D;
            box-shadow: 0 0 0 2px rgba(125, 51, 125, 0.2);
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        /* Send Message Button */
        .send-button {
            width: 100%;
            padding: 16px 40px;
            background-color: #7D337D;
            color: #FFFFFF;
            border: none;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            font-family: 'Lato', sans-serif;
        }
        
        .send-button:hover {
            background-color: #543178;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: translateY(-4px) scale(1.05);
        }
        
        .send-button:active {
            transform: translateY(-2px) scale(1.02);
        }
    </style>
</head>
<body>
    <section class="contact-section" id="contact">
        <div class="contact-container">
            <div class="contact-card">
                <!-- Left Sidebar -->
                <div class="contact-sidebar">
                    <div>
                        <h3>Let's Connect</h3>
                        <p>Ready to start your transformation? Send me a message and let's discuss how we can work together.</p>
                    </div>
                    <div class="contact-info">
                        <div class="contact-info-item">
                            <i data-lucide="mail"></i>
                            <span>hello@shannonchapoy.com</span>
                        </div>
                        <div class="social-links">
                            <a href="#" class="social-link" aria-label="Instagram">
                                <i data-lucide="instagram"></i>
                            </a>
                            <a href="#" class="social-link" aria-label="Facebook">
                                <i data-lucide="facebook"></i>
                            </a>
                            <a href="#" class="social-link" aria-label="LinkedIn">
                                <i data-lucide="linkedin"></i>
                            </a>
                        </div>
                    </div>
                </div>
                
                <!-- Form Section -->
                <div class="contact-form-wrapper">
                    <form class="contact-form" onsubmit="event.preventDefault();">
                        <div class="form-group">
                            <label for="name" class="form-label">Your Name</label>
                            <input 
                                type="text" 
                                id="name" 
                                class="form-input" 
                                placeholder="Jane Doe"
                            />
                        </div>
                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <input 
                                type="email" 
                                id="email" 
                                class="form-input" 
                                placeholder="jane@example.com"
                            />
                        </div>
                        <div class="form-group">
                            <label for="message" class="form-label">How can I help?</label>
                            <textarea 
                                id="message" 
                                rows="4" 
                                class="form-textarea" 
                                placeholder="Tell me a bit about your journey..."
                            ></textarea>
                        </div>
                        <button type="submit" class="send-button">
                            Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
