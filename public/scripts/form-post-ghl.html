<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('form');
        if (!form) return;

        // 100% reliable selector using your data-q attribute
        const voucherInput = form.querySelector('input[data-q="voucher-code"]');

        if (!voucherInput) {
            console.warn('Voucher code field not found');
            return;
        }

        // Create styled error message right under the field
        const errorDiv = document.createElement('div');
        errorDiv.style.color = '#d32f2f';
        errorDiv.style.fontSize = '14px';
        errorDiv.style.marginTop = '6px';
        errorDiv.style.fontWeight = '500';
        errorDiv.style.display = 'none';
        voucherInput.parentElement.appendChild(errorDiv);

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            // Clear old error
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            const code = voucherInput.value.trim();

            // If empty and not required → skip validation and submit
            if (!code) {
                return;
                form.submit();
            }

            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn?.textContent || 'Submit';

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Validating code...';
            }

            try {
                const response = await fetch('https://shannonchapoy.com/api/validate-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        code: code,
                        formType: 'pj-circle'  // Change only if you have multiple forms
                    })
                });

                const result = await response.json();

                if (response.ok && result.valid === true) {
                    // Valid code → submit for real
                    form.removeEventListener('submit', arguments.callee);
                    form.submit();
                } else {
                    const msg = result.message || result.error || 'Invalid or expired voucher code';
                    errorDiv.textContent = msg;
                    errorDiv.style.display = 'block';
                    voucherInput.focus();
                }
            } catch (err) {
                console.error('API error:', err);
                errorDiv.textContent = 'Validation failed — please try again';
                errorDiv.style.display = 'block';
                voucherInput.focus();
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }
            }
        });
    });
</script>
