<script>
  ;(function () {
    console.log('Script loaded immediately') // This should show first
    // Target your exact field by its unique name or data-q
    const voucherInput = document.querySelector('input[data-q="voucher-code"]')

    if (!voucherInput) {
      console.log('Voucher field not found yet – will retry once')
      setTimeout(arguments.callee, 1000) // retry once after 1s (covers Vue delay)
      return
    }

    // Find the submit button directly (no form element needed)
    const submitBtn = document.querySelector('button[type="submit"]')

    // Track if user has blurred the field at least once
    let hasBlurredOnce = false

    async function validate() {
      const code = voucherInput.value.trim()
      let errorMessage = null
      let isValid = false
      if (!code) {
        isValid = true
      } else {
        try {
          const response = await fetch('https://shannonchapoy.com/api/validate-code', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json'
            },
            body: JSON.stringify({
              code: code,
              formType: 'pj-circle' // Change only if you have multiple forms
            })
          })

          const result = await response.json()
          isValid = result.valid
          errorMessage = result.error || 'Invalid or expired voucher code'
        } catch (err) {
          console.error('API error:', err)
          isValid = false
          errorMessage = 'Validation failed — please try again'
        }
      }
      // Remove old error if exists
      const oldError = voucherInput.parentNode.querySelector('.my-voucher-error')
      if (oldError) oldError.remove()
      const oldSuccess = voucherInput.parentNode.querySelector('.my-voucher-success')
      if (oldSuccess) oldSuccess.remove()
      if (!isValid) {
        // Add red border
        voucherInput.style.borderColor = '#dc3545'
        voucherInput.style.boxShadow = '0 0 0 0.2rem rgba(220,53,69,.25)'

        // Add error message below the field
        const error = document.createElement('div')
        error.textContent = errorMessage
        error.style.color = '#dc3545'
        error.style.fontSize = '0.875rem'
        error.style.marginTop = '4px'
        error.className = 'my-voucher-error'
        voucherInput.parentNode.appendChild(error)
      } else {
        if (code) {
          const success = document.createElement('div')
          success.textContent = 'Code is valid'
          success.style.color = '#28a745'
          success.style.fontSize = '0.875rem'
          success.style.marginTop = '4px'
          success.className = 'my-voucher-success'
          voucherInput.parentNode.appendChild(success)
        }
        // Valid or empty → clean style
        voucherInput.style.borderColor = ''
        voucherInput.style.boxShadow = ''
      }

      // Enable/disable submit button based on isValid
      if (submitBtn) {
        submitBtn.disabled = !isValid
      }
    }

    // Run on blur (when user leaves the field)
    voucherInput.addEventListener('blur', function () {
      validate()
      // After first blur, enable instant feedback as they type
      if (!hasBlurredOnce) {
        hasBlurredOnce = true
        voucherInput.addEventListener('input', validate)
      }
    })

    // Set initial button state based on current field value
    if (submitBtn) {
      const initialCode = voucherInput.value.trim()
      if (initialCode) {
        // If there's a code, validate it to set button state
        validate()
      } else {
        // If empty, enable the button
        submitBtn.disabled = false
      }
    }

    console.log('Voucher validation active')
  })()
</script>
